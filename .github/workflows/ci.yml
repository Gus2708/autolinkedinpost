name: "CI"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-and-tests:
    name: "Python ${{ matrix.python-version }} on ubuntu-latest"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Bytecode syntax compilation check
        run: |
          python -m compileall src bot.py main.py

      - name: Code quality & lint check (Ruff)
        run: |
          ruff check src bot.py main.py tests

      - name: Run fast diagnostic tests
        run: |
          python -m pytest tests/test_fast_diagnostics.py -v

      - name: Run complete test suite
        run: |
          python -m pytest -v
