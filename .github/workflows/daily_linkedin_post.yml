name: "Daily Technical LinkedIn Post Generator"

# El evento `schedule` de GitHub es best-effort: los disparos se retrasan o se
# descartan bajo carga. Medido en este repo entre el 24 y el 28 de agosto de 2026,
# sólo 3 de 5 disparos ocurrieron, y uno llegó con más de 3 horas de retraso.
# Por eso el cron queda como RESPALDO y la ejecución confiable llega desde un
# disparador externo que invoca workflow_dispatch por API (ver docs/scheduling.md).
# El step "Evitar ejecuciones duplicadas" impide que ambas fuentes publiquen dos veces.
on:
  schedule:
    - cron: "20 21 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás para buscar actividad (1 = hoy)"
        required: false
        default: "1"
        type: string
      dry_run:
        description: "Ejecutar en modo prueba sin enviar a Telegram"
        required: false
        default: false
        type: boolean
      force:
        description: "Ejecutar aunque ya haya habido una publicación reciente"
        required: false
        default: false
        type: boolean

jobs:
  generate-and-notify:
    runs-on: ubuntu-latest
    # El render del carrusel con Chromium y la cascada de LLM pueden tardar; sin
    # techo explícito el job hereda el default de 6 horas de GitHub.
    timeout-minutes: 30

    steps:
      # Con dos fuentes de disparo (cron de respaldo + disparador externo cron-job.org),
      # un mismo día podría publicarse dos veces. Este guard asegura exactamente 1
      # corrida diaria salvo que se fuerce con `force: true`:
      # - Si viene de schedule (cron de respaldo), se descarta si ya hubo una corrida
      #   exitosa en las últimas 20 horas.
      # - Si viene de workflow_dispatch (cron-job.org o manual), se descarta si ya
      #   hubo otra corrida exitosa en las últimas 20 horas (evita reintentos o clics repetidos).
      # - Además, se extrae la fecha de inicio de la última corrida exitosa real
      #   (duración > 45s) para usarla como ventana dinámica de commits (`since`),
      #   garantizando que no se pierda ningún commit entre corridas sucesivas.
      - name: Evitar ejecuciones duplicadas
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Ejecución forzada por input: se omite el guard."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            # Buscar igualmente la última corrida previa para acotar since
            last_run=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/daily_linkedin_post.yml/runs?per_page=30" \
              --jq "[.workflow_runs[]
                     | select(.id != ${{ github.run_id }})
                     | select(.conclusion == \"success\")
                     | select((( .updated_at | fromdateiso8601 ) - ( .created_at | fromdateiso8601 )) > 45)]
                     | .[0].created_at // \"\"")
            echo "last_run=${last_run}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          lookback="20 hours ago"
          since=$(date -u -d "$lookback" +%Y-%m-%dT%H:%M:%SZ)

          runs_json=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/daily_linkedin_post.yml/runs?per_page=30")

          previos=$(echo "$runs_json" | jq "[.workflow_runs[]
                   | select(.id != ${{ github.run_id }})
                   | select(.conclusion == \"success\")
                   | select(.created_at > \"$since\")
                   | select((( .updated_at | fromdateiso8601 ) - ( .created_at | fromdateiso8601 )) > 45)] | length")

          last_run=$(echo "$runs_json" | jq -r "[.workflow_runs[]
                   | select(.id != ${{ github.run_id }})
                   | select(.conclusion == \"success\")
                   | select((( .updated_at | fromdateiso8601 ) - ( .created_at | fromdateiso8601 )) > 45)]
                   | .[0].created_at // empty")

          echo "last_run=${last_run}" >> "$GITHUB_OUTPUT"

          if [ "${previos:-0}" -gt 0 ]; then
            echo "Ya hubo $previos ejecución(es) real(es) exitosa(s) desde $since ($lookback). Se omite esta corrida para evitar duplicados."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin ejecuciones previas desde $since ($lookback). Continúa."
            if [ -n "$last_run" ]; then
              echo "Última corrida previa exitosa detectada: $last_run"
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout del código
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Configurar Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # Cachear el navegador evita volver a descargar ~150 MB en cada corrida diaria.
      - name: Cachear navegador de Playwright
        if: steps.guard.outputs.skip != 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium
        if: steps.guard.outputs.skip != 'true'
        run: playwright install --with-deps chromium

      - name: Despertar bot de Render (Keep-Alive)
        if: steps.guard.outputs.skip != 'true'
        run: |
          curl -s -m 15 https://autolinkedinpost.onrender.com || true

      - name: Ejecutar generador
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openrouter' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'anthropic/claude-sonnet-4.5' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          LINKEDIN_PLATFORM_ID: ${{ secrets.LINKEDIN_PLATFORM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_USERNAME: ${{ secrets.GH_USERNAME || github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '1' }}
          SINCE_DATE: ${{ steps.guard.outputs.last_run }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -u main.py --dry-run
          else
            python -u main.py
          fi
