name: "Daily Technical LinkedIn Post Generator"

on:
  schedule:
    # Se ejecuta todos los días a las 21:20 UTC (evita congestión del minuto 0 en GitHub)
    - cron: "20 21 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás para buscar actividad (1 = hoy)"
        required: false
        default: "1"
        type: string
      dry_run:
        description: "Ejecutar en modo prueba sin enviar a Telegram"
        required: false
        default: false
        type: boolean

jobs:
  generate-and-notify:
    runs-on: ubuntu-latest
    # El render del carrusel con Chromium y la cascada de LLM pueden tardar; sin
    # techo explícito el job hereda el default de 6 horas de GitHub.
    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Cachear el navegador evita volver a descargar ~150 MB en cada corrida diaria.
      - name: Cachear navegador de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar Chromium
        run: playwright install --with-deps chromium

      - name: Ejecutar generador
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gemini-3.5-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_USERNAME: ${{ secrets.GH_USERNAME || github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '1' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -u main.py --dry-run
          else
            python -u main.py
          fi
