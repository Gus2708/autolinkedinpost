services:
  - type: web
    name: auto-linkedin-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHONIOENCODING
        value: utf-8
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GH_USERNAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GH_TOKEN
        sync: false
