# NOTA sobre el plan free:
#   - El bot usa long-polling (getUpdates), que no genera tráfico HTTP entrante, así
#     que Render duerme el servicio tras ~15 min de inactividad. Para mantenerlo vivo
#     hay que apuntar un pinger externo (UptimeRobot, cron-job.org) al healthcheck.
#   - Chromium con WebGL para renderizar el carrusel puede superar los 512 MB del
#     plan free. Si el proceso muere durante la generación del PDF, es OOM: subir de plan.
services:
  - type: web
    name: auto-linkedin-bot
    runtime: python
    plan: free
    region: oregon
    # El build lanza Chromium de verdad al final. Antes sólo corría `playwright
    # install` y, si el binario no quedaba donde el runtime lo busca, el deploy se
    # marcaba verde y el fallo recién aparecía al pedir un carrusel, ya en producción.
    buildCommand: >-
      pip install -r requirements.txt &&
      playwright install chromium &&
      python -c "from playwright.sync_api import sync_playwright;
      p=sync_playwright().start();
      b=p.chromium.launch(args=['--disable-dev-shm-usage']);
      print('[BUILD] Chromium operativo:', b.version);
      b.close(); p.stop()"
    startCommand: python bot.py
    envVars:
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PYTHONUNBUFFERED
        value: "1"
      # El bot es multi-proveedor: estas dos variables son las que lee llm_client.
      # Antes sólo se definía GEMINI_MODEL, así que en Render el selector de
      # proveedor quedaba sin configurar.
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: anthropic/claude-sonnet-4.5
      - key: GH_USERNAME
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Respaldo opcional si se vuelve a Gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GH_TOKEN
        sync: false
      # LinkedIn 2026 Engine & Automated Publishing
      - key: PUBLORA_API_KEY
        sync: false
      - key: LINKEDIN_PLATFORM_ID
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: PIXFARO_TOKEN
        sync: false
